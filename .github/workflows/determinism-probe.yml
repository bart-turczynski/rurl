# Cross-platform parse-determinism probe (RURL-ttrcfneq).
#
# EVIDENCE COLLECTION, NOT A GATE. It delegates the matrix and per-cell body to
# the reusable _determinism-cells.yml and uploads per-cell artifacts; divergence
# between cells is the finding, so a divergence must NEVER fail the build. This
# is the deep RESEARCH sweep (curl-probe + env dumps + the non-comparable
# `default` cells as evidence).
#
# DISPATCH-ONLY by design. The automatic determinism signal on parse/harness
# changes -- the FAILING comparison C-09 requires -- is the separate
# determinism-gate.yml, which reuses the SAME cell matrix. Keeping this probe
# off the pull_request trigger avoids paying for two 17-cell matrices on a
# harness PR; run it manually when a deep evidence dump is wanted.
#
# Cost: 17 jobs incl. Windows (2x) and macOS (10x) minute multipliers.
name: Determinism probe

on:
  workflow_dispatch:
    inputs:
      run_parse_dump:
        description: 'Also run the full rurl stack probe (parse-dump.R)'
        type: boolean
        default: true

permissions: read-all

concurrency:
  # No cancel-in-progress: a half-collected sweep is worthless evidence.
  group: determinism-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cells:
    # Non-gating research posture: run every cell, collect artifacts, never fail
    # on divergence. run_parse_dump honors the dispatch toggle; PRs always run it.
    uses: ./.github/workflows/_determinism-cells.yml
    with:
      run_parse_dump: ${{ github.event_name != 'workflow_dispatch' || inputs.run_parse_dump }}
