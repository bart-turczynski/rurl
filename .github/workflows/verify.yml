# Fast verification gate: lint + a single Ubuntu R CMD check on every push to
# main and every PR. Coverage and the specialized evidence jobs run only when
# their declared surfaces change. Release tags run the complete job set; full
# cross-platform checks live in full-check.yml. Named "R-CMD-check" so tooling
# that discovers CI by the conventional workflow name sees it.
name: R-CMD-check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One cheap diff classifies the PR before specialized jobs reserve runners.
  # Manual and release-tag runs bypass these filters below: both are evidence
  # collection points, not routine feedback.
  changes:
    runs-on: ubuntu-latest
    outputs:
      documentation: ${{ steps.filter.outputs.documentation }}
      locale: ${{ steps.filter.outputs.locale }}
      coverage: ${{ steps.filter.outputs.coverage }}
      oracle: ${{ steps.filter.outputs.oracle }}
      traceability: ${{ steps.filter.outputs.traceability }}
      cache_docs_selftest: ${{ steps.filter.outputs.cache_docs_selftest }}
      oracle_provenance_selftest: ${{ steps.filter.outputs.oracle_provenance_selftest }}
      credentials_selftest: ${{ steps.filter.outputs.credentials_selftest }}
      ip_obfuscation_selftest: ${{ steps.filter.outputs.ip_obfuscation_selftest }}
      youarealiar_selftest: ${{ steps.filter.outputs.youarealiar_selftest }}
      equivocal_urls_selftest: ${{ steps.filter.outputs.equivocal_urls_selftest }}
      wpt_urltestdata_selftest: ${{ steps.filter.outputs.wpt_urltestdata_selftest }}
      ada_extra_selftest: ${{ steps.filter.outputs.ada_extra_selftest }}
      ada_dnslength_selftest: ${{ steps.filter.outputs.ada_dnslength_selftest }}
      release_rule_selftest: ${{ steps.filter.outputs.release_rule_selftest }}
      traceability_selftest: ${{ steps.filter.outputs.traceability_selftest }}
      status_docs_selftest: ${{ steps.filter.outputs.status_docs_selftest }}
      diagnostics_docs_selftest: ${{ steps.filter.outputs.diagnostics_docs_selftest }}
      deferral_selftest: ${{ steps.filter.outputs.deferral_selftest }}
      curl_zero_selftest: ${{ steps.filter.outputs.curl_zero_selftest }}
      oracle_labels_selftest: ${{ steps.filter.outputs.oracle_labels_selftest }}
      citations: ${{ steps.filter.outputs.citations }}
      citations_selftest: ${{ steps.filter.outputs.citations_selftest }}
      pkgdown_index: ${{ steps.filter.outputs.pkgdown_index }}
      pkgdown_index_selftest: ${{ steps.filter.outputs.pkgdown_index_selftest }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            documentation:
              - 'README.Rmd'
              - 'README.md'
              - 'R/**'
              - 'man/**'
              - 'vignettes/**'
              - 'DESCRIPTION'
              - 'NAMESPACE'
              - 'tools/*doc-consistency.R'
              - 'design/work/url-v3/contracts/**'
              - 'design/work/url-v3/tools/traceability-gate.R'
              - '.github/workflows/verify.yml'
            locale:
              - 'R/**'
              - 'tests/**'
              - 'DESCRIPTION'
              - 'NAMESPACE'
              - '.github/workflows/verify.yml'
            coverage:
              - 'R/**'
              - 'tests/**'
              - 'DESCRIPTION'
              - 'NAMESPACE'
              - '.github/workflows/verify.yml'
            oracle:
              - 'tests/testthat/fixtures/**'
              - 'tests/testthat/helper-rfc3986-*.R'
              - 'tests/testthat/test-external-url-vectors.R'
              - 'tests/testthat/test-rfc3986-*.R'
              - 'tools/oracle/**'
              - 'tools/oracle-provenance-gate.R'
              - 'design/work/url-v3/registers/oracle-register.md'
              - 'design/work/url-v3/tools/oracle-label-gate.R'
              - '.github/workflows/verify.yml'
            # The claim-traceability gate used to ride the broad `documentation`
            # filter, which does not mention the verification directory at all
            # -- so ADDING A VERIFICATION RECORD did not run the gate that is
            # supposed to account for it. That is the same blindness class the
            # gate's T8 rule closes inside the record (P0.7 D-E), and leaving it
            # in the trigger would have kept the reverse-direction check
            # unreachable in CI for the one edit that trips it.
            traceability:
              - 'design/work/url-v3/contracts/**'
              - 'design/work/url-v3/verification/**'
              - 'design/work/url-v3/tools/traceability-gate.R'
              - '.github/workflows/verify.yml'
            cache_docs_selftest:
              - 'tools/cache-doc-consistency.R'
            oracle_provenance_selftest:
              - 'tools/oracle-provenance-gate.R'
            credentials_selftest:
              - 'tools/oracle/verify-credentials-fragments.R'
            ip_obfuscation_selftest:
              - 'tools/oracle/verify-ip-obfuscation.R'
            youarealiar_selftest:
              - 'tools/oracle/verify-youarealiar.R'
            equivocal_urls_selftest:
              - 'tools/oracle/verify-equivocal-urls.R'
            wpt_urltestdata_selftest:
              - 'tools/oracle/verify-wpt-urltestdata.R'
              - 'tools/oracle/relocate-wpt-format.R'
              - 'tools/oracle/check-fsss-conformance.R'
              - 'tools/oracle/fetch-source.R'
            ada_extra_selftest:
              - 'tools/oracle/verify-ada-extra-urltestdata.R'
              - 'tools/oracle/relocate-wpt-format.R'
              - 'tools/oracle/check-fsss-conformance.R'
              - 'tools/oracle/fetch-source.R'
            ada_dnslength_selftest:
              - 'tools/oracle/verify-ada-verifydnslength.R'
              - 'tools/oracle/derive-verifydnslength.R'
              - 'tools/oracle/derive-ip-obfuscation.R'
              - 'tools/oracle/fetch-source.R'
            release_rule_selftest:
              - 'tools/release-rule-check.R'
            traceability_selftest:
              - 'design/work/url-v3/tools/traceability-gate.R'
            status_docs_selftest:
              - 'tools/status-doc-consistency.R'
            diagnostics_docs_selftest:
              - 'tools/diagnostics-doc-consistency.R'
            deferral_selftest:
              - 'tools/deferral-gate.R'
            curl_zero_selftest:
              - 'tools/curl-zero-gate.R'
            oracle_labels_selftest:
              - 'design/work/url-v3/tools/oracle-label-gate.R'
            # The citation gate resolves key-join-discharge.md's and
            # public-surface-inventory.md's citations against
            # key-join-contracts.md. All THREE have to trigger it: the drift it
            # exists to catch is created by editing the CONTRACT, which is the
            # one file whose author has no reason to think about the citations
            # pointing at it. Listing only the citing artifacts would leave the
            # gate unreachable for exactly the edit that breaks it.
            citations:
              - 'design/work/url-v3/contracts/key-join-contracts.md'
              - 'design/work/url-v3/verification/key-join-discharge.md'
              - 'design/work/url-v3/registers/public-surface-inventory.md'
              - 'design/work/url-v3/tools/citation-gate.R'
              - '.github/workflows/verify.yml'
            citations_selftest:
              - 'design/work/url-v3/tools/citation-gate.R'
            # NAMESPACE is the trigger that matters: the gap this gate catches
            # is created by EXPORTING something, in a slice whose author has no
            # reason to open `_pkgdown.yml`. man/ is listed too because renaming
            # an Rd topic can orphan an index entry without touching NAMESPACE.
            pkgdown_index:
              - 'NAMESPACE'
              - 'man/**'
              - '_pkgdown.yml'
              - 'tools/pkgdown-reference-gate.R'
              - '.github/workflows/verify.yml'
            pkgdown_index_selftest:
              - 'tools/pkgdown-reference-gate.R'

  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LINTR_ERROR_ON_LINT: true
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}

  readme:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    name: README in sync with README.Rmd
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # devtools::build_readme() installs the package and re-renders
          # README.Rmd (its code chunks are static, but build_readme still
          # builds + installs the package before rendering).
          extra-packages: any::devtools
          needs: check
      - name: Re-render README.md from README.Rmd
        run: devtools::build_readme()
        shell: Rscript {0}
      - name: Fail if README.md is out of date
        run: |
          if ! git diff --exit-code -- README.md; then
            echo "::error file=README.md::README.md is out of sync with README.Rmd. Run devtools::build_readme() and commit the result."
            exit 1
          fi

  check:
    needs: lint
    runs-on: ubuntu-latest
    name: R CMD check (ubuntu-latest, release)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          # Fast gate runs a standard check; the strict --as-cran pass lives in
          # full-check.yml (and the local pre-push hook).
          args: '"--no-manual"'
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # The locale-invariance gate (RURL-izzuenjx). rurl's output must not depend
  # on the session's LC_CTYPE -- same input, same values AND same Encoding()
  # marks -- so the suite has to actually RUN under a non-UTF-8 charset
  # somewhere. It lives here rather than in full-check.yml because it is a
  # one-job Linux cell (no matrix multiplier) guarding a class of defect that
  # is cheap to reintroduce on any parse-path PR: the fast gate is where it
  # earns its keep. It is deliberately NOT the determinism probe, which
  # collects evidence across OS x R x charset and never fails a build.
  locale:
    needs: [lint, changes]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.locale == 'true'
    runs-on: ubuntu-latest
    name: Tests (LC_ALL=C)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
          needs: check

      # LC_ALL is set per-step, not job-wide, so dependency installation runs
      # in the runner's normal environment and only the probed session is
      # forced to C. It is exported before R is exec'd (never via a mid-session
      # Sys.setlocale()): ICU, which stringi and therefore rurl's case folding
      # sit on, picks its default locale at initialization, so a late switch
      # can leave a cell looking green while probing the wrong charset.
      - name: Assert the C locale actually took effect
        env:
          LC_ALL: C
          LANG: C
        shell: Rscript {0}
        run: |
          ctype <- Sys.getlocale("LC_CTYPE")
          utf8 <- isTRUE(l10n_info()[["UTF-8"]])
          cat("LC_CTYPE:      ", ctype, "\n", sep = "")
          cat("l10n_info UTF-8:", utf8, "\n", sep = " ")
          # A silently-UTF-8 cell is a gate that proves nothing, so the
          # requested charset is asserted rather than assumed. "C" always
          # exists on a Linux runner -- nothing needs generating -- so a
          # mismatch here means the environment did not reach R at all.
          if (!identical(ctype, "C") || utf8) {
            stop("requested LC_CTYPE=C but got '", ctype,
                 "' (UTF-8 = ", utf8, ")")
          }

      # testthat::test_local() fails the step on any test FAILURE
      # (stop_on_failure). Warnings are reported but tolerated on purpose:
      # under LC_ALL=C, pslr's own bundled_snapshot() emits "strings not
      # representable in native encoding will be translated to UTF-8". That is
      # UPSTREAM (PSLR-jzdhhugc) and rurl cannot fix it, so this cell must not
      # be written to fail on it.
      - name: Run the test suite under LC_ALL=C
        env:
          LC_ALL: C
          LANG: C
        shell: Rscript {0}
        run: |
          stopifnot(identical(Sys.getlocale("LC_CTYPE"), "C"))
          testthat::test_local(reporter = "summary", stop_on_failure = TRUE)

  # C-08 documentation-consistency gate (G4.1). The full_parse cache has one
  # authoritative default bound (.FULL_PARSE_MAX_DEFAULT in R/zzz.R); every
  # documented bound (README, cache roxygen -> man/*.Rd, vignettes, inline R/
  # comments) must agree with it. Deterministic and network-free: it reads the
  # source-of-truth by sourcing R/zzz.R, so it needs no package build and no
  # dependencies beyond base R. The --self-test run exercises the gate's own
  # positive/negative coverage before it scans the tree.
  cache-docs:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    name: Cache docs match runtime default (C-08)
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.cache_docs_selftest == 'true'
        run: Rscript tools/cache-doc-consistency.R --self-test
      - name: Scan documentation for full_parse default-bound drift
        run: Rscript tools/cache-doc-consistency.R

  # Oracle-provenance gate (G4, S8 finding 9 / P5.3 SS2.3). The provenance of
  # every normative fixture is recorded in
  # tests/testthat/fixtures/oracle-provenance.json; this job makes that record
  # executable instead of decorative. It RECOMPUTES every quantity the record
  # states about a tracked file -- each transformed-fixture sha256, each row and
  # case count, the WPT fixture's own _meta counts -- because a recorded hash or
  # tally is a claim, not evidence. It then holds the section-2.3 field set on
  # every in-scope source group (a gap must read as MISSING[<fp-issue>], never
  # as a blank), forbids that sentinel where a group is out of scope, pins the
  # record against the in-band _meta so no second copy can drift, and requires
  # the recorded group keys to be an exact bijection with the fixture's source
  # column so neither an unprovenanced new upstream nor a stale group can hide.
  # Deterministic, network-free, tracked files only -- no package build. The
  # anchor was chosen deliberately (between cache-docs and release-rule) to
  # avoid collisions with the concurrent branches inserting around status-docs
  # and at the end of this file.
  oracle-provenance:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    name: Oracle provenance record matches the fixtures
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install gate dependencies
        shell: Rscript {0}
        run: install.packages(c("jsonlite", "digest"))
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.oracle_provenance_selftest == 'true'
        run: Rscript tools/oracle-provenance-gate.R --self-test
      - name: Verify the provenance record against the fixture bytes
        run: Rscript tools/oracle-provenance-gate.R

  # Oracle re-derivation (RURL-ozdejfzl). The provenance gate above checks that a
  # generation_command is RECORDED; it cannot check that the command runs, so a
  # recorded builder living in gitignored _scratch/ passed it while naming
  # something no clean checkout could execute. This job closes the other half for
  # the wpt-credentials-fragments group: it re-derives all 43 expected values
  # from the committed WPT import by an independent transcription of URL Standard
  # SS4.5 and compares them to the recorded ones, so the record's "43/43
  # re-derive" claim is re-tested on every run rather than resting on one
  # hand-verification. It also re-applies the de-duplication that selected the
  # block, which is what notices if a later corpus addition changed what this
  # group ought to contain.
  #
  # Deliberately installs NO package and never calls devtools::load_all(): an
  # oracle that can reach the implementation it grades is a characterization
  # test wearing an oracle's label. The independence is structural, not a comment.
  oracle-rederivation:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    name: Committed oracle values re-derive from their upstream components
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install gate dependencies
        shell: Rscript {0}
        run: install.packages("jsonlite")
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.credentials_selftest == 'true'
        run: Rscript tools/oracle/verify-credentials-fragments.R --self-test
      - name: Re-derive the committed oracle values
        run: Rscript tools/oracle/verify-credentials-fragments.R
      # ip-obfuscation is the group with NO upstream artifact, so
      # re-derivability is not a convenience here -- it is the only provenance
      # the group has. Its record says so in prose ("derivable from arithmetic
      # alone"); this makes the sentence executable.
      - name: Gate self-test (ip-obfuscation)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.ip_obfuscation_selftest == 'true'
        run: Rscript tools/oracle/verify-ip-obfuscation.R --self-test
      - name: Re-derive the committed oracle values (ip-obfuscation)
        run: Rscript tools/oracle/verify-ip-obfuscation.R
      # youarealiar is TIER 3: its expected values are transcribed from a paper,
      # so there is no algorithm to re-run and this gate checks transcription
      # INTEGRITY -- primary-source cells, byte exactness of the three rows whose
      # PDF escaping was ambiguous, restatement fidelity, and citations. It
      # cannot establish correctness, and it says so in its own output.
      - name: Gate self-test (youarealiar transcription)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.youarealiar_selftest == 'true'
        run: Rscript tools/oracle/verify-youarealiar.R --self-test
      - name: Committed transcription is intact (youarealiar)
        run: Rscript tools/oracle/verify-youarealiar.R
      # equivocal-urls is the most irrecoverable group in the fixture: the paper
      # released NO artifact, so there is not even a third-party repo to
      # byte-check against. Integrity, byte exactness, and the [0xNN]
      # octet-notation exception for the two un-representable rows.
      - name: Gate self-test (equivocal-urls transcription)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.equivocal_urls_selftest == 'true'
        run: Rscript tools/oracle/verify-equivocal-urls.R --self-test
      - name: Committed transcription is intact (equivocal-urls)
        run: Rscript tools/oracle/verify-equivocal-urls.R
      # wpt-urltestdata is TIER 2: its 267 expected values were read out of
      # upstream bytes this repository does NOT vendor, so the full verifier has
      # to fetch the pinned revision and cannot run offline. Only --self-test is
      # wired here, which is the tools/oracle/check-uts46-mapping-pin.R posture:
      # a network-reading check is not a blocking gate, because an upstream
      # outage is not a defect in this repository. The self-test is offline and
      # grades the parts that are logic -- the failure-arm selector, the
      # `runnable` classifier, and the NUL shim whose failure mode is a silent
      # false PASS rather than an error.
      - name: Gate self-test (wpt-urltestdata re-location)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.wpt_urltestdata_selftest == 'true'
        run: Rscript tools/oracle/verify-wpt-urltestdata.R --self-test
      # ada-extra-urltestdata is the tier-2 group whose pinned revision does NOT
      # reproduce one expected value: upstream re-expected a case after the
      # import. Its two exact ledgers, and the second anchor that dates them,
      # are graded by the full run; --self-test grades the ledger LOGIC in all
      # four of its states, which is offline.
      - name: Gate self-test (ada-extra-urltestdata re-location)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.ada_extra_selftest == 'true'
        run: Rscript tools/oracle/verify-ada-extra-urltestdata.R --self-test
      # ada-verifydnslength is the one tier-2 group whose VERDICTS are not
      # upstream's: upstream rejects 10 of its 17 hosts under Ada's optional
      # verify_dns_length, while the fixture records `accept` for all 17 against
      # the WHATWG default. So its expectations are derived, not copied, and the
      # gate re-derives BOTH readings -- the one that produces the committed
      # value and the one that produces upstream's -- so the disagreement is
      # explained rather than tolerated. --self-test grades both readings
      # offline, including the trailing-empty-field split trap.
      - name: Gate self-test (ada-verifydnslength derivation)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.ada_dnslength_selftest == 'true'
        run: Rscript tools/oracle/verify-ada-verifydnslength.R --self-test

  # Structural validator for the §6 records (ADR 0014). This replaces both the
  # pin-inventory job and the retired control-plane workflow.
  #
  # Until ADR 0014 this validator ran ONLY via ci-gate.R, which tools/verify.R
  # treated as ADVISORY -- it printed a verdict and never failed a push -- and
  # via a control-plane.yml that could not run at all once origin moved off
  # GitHub. So the checks that catch real defects (a duplicated record id, a
  # dangling reference, an export no inventory row covers, a register that has
  # drifted out of bijection with its sources) were the ones nothing enforced,
  # while the hash cascade that only a re-seal could clear was blocking.
  #
  # That is now inverted. The ratification half is deleted and what remains is
  # wired here as an ordinary blocking gate, which also means tools/verify.R
  # picks it up automatically -- it derives its gate list from this file.
  control-plane:
    runs-on: ubuntu-latest
    name: Records are structurally sound (§6)
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install gate dependencies
        shell: Rscript {0}
        run: install.packages("yaml")
      - name: Validate the record family
        run: Rscript design/work/url-v3/tools/validate-records.R

  # C-10 release-rule gate (G4.3). Verifies the ACCEPTED owner disposition P0.4:
  # the "no CRAN until curl-free" hold is bound to the v3 (3.0.0) line and does
  # not reach the v2.x curl-bearing maintenance line, and no normative record
  # broadens the hold onto v2.x or permits a curl-bearing v3. Deterministic,
  # network-free, base R only -- it reads tracked records, so it needs no
  # package build. It does NOT assert "3.x cannot ship with curl"; that closure
  # criterion is carried whole by its own G4 leaf (RURL-cunfohwy).
  release-rule:
    needs: changes
    runs-on: ubuntu-latest
    name: Release rule matches the accepted C-10 boundary
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.release_rule_selftest == 'true'
        run: Rscript tools/release-rule-check.R --self-test
      - name: Verify the release rule over the normative corpus
        run: Rscript tools/release-rule-check.R

  # parse_status documentation-consistency gate (G4, migration family). The
  # status vocabulary has one authoritative definition -- the `.STATUS_*`
  # constants in R/status-constants.R -- and this gate holds the documentation
  # to it in both directions: every enumerating doc site lists every value (S1),
  # no doc mentions a status literal with no constant behind it (S2), the
  # ok/warning/error partition holds (S3), and the vocabulary size is pinned so
  # a new token cannot appear silently (S4, the M-8 freeze). Deterministic and
  # network-free: it sources the constants file, so it needs no package build.
  # G4 criterion 1: "Every normative claim maps to tests, fixtures, benchmarks,
  # or a documented manual verification with exact commands." S9 H6 (RCON-10)
  # asks for automated orphan/reverse-coverage checks, because a list of
  # citations cannot show what it omits. This gate derives the claim population
  # from the §6 contracts themselves -- add a contract row and it fails until
  # the row's section has an owning verification slice -- and pins the
  # generated index/census byte-for-byte. Deterministic, network-free, base R.
  #
  # Inserted BEFORE `status-docs` deliberately. PR #246 inserts its gate AFTER
  # `status-docs` and PR #250 appends at the end of the file; three concurrent
  # branches need three distinct anchors, and this is the third.
  claim-traceability:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.traceability == 'true'
    runs-on: ubuntu-latest
    name: Every normative claim has an owning verification slice (G4 criterion 1)
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (T0-T8, positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.traceability_selftest == 'true'
        run: Rscript design/work/url-v3/tools/traceability-gate.R --self-test
      - name: Orphan / reverse-coverage check over the contract family
        run: Rscript design/work/url-v3/tools/traceability-gate.R

  status-docs:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    name: parse_status docs match the status constants (M-8/M-14)
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.status_docs_selftest == 'true'
        run: Rscript tools/status-doc-consistency.R --self-test
      - name: Scan documentation for status-vocabulary drift
        run: Rscript tools/status-doc-consistency.R

  # Diagnostics-vocabulary documentation-consistency gate (epic RURL-rnobeauh).
  # The diagnostics vocabulary has one authoritative definition -- the
  # `.URL_DIAGNOSTICS` registry in R/diagnostics.R -- and one authoritative
  # enumeration of it, the "Diagnostic vocabulary (canonical)" section of
  # get_url_diagnostics(). This gate holds them to each other in both
  # directions (D1 completeness, D2 no extras), forbids a diagnostic-shaped
  # literal anywhere in R/ or man/ that no longer resolves to a token (D3), and
  # pins the vocabulary size so a token cannot appear silently (D4). It exists
  # because that prose drifted twice unnoticed: the only "docs" the vocabulary
  # pointed at was a graduated PRD, which ADR 0008 makes a historical record
  # rather than a registry. Deterministic and network-free: it sources the
  # registry file, so it needs no package build.
  diagnostics-docs:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    name: Diagnostics docs match the vocabulary registry
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.diagnostics_docs_selftest == 'true'
        run: Rscript tools/diagnostics-doc-consistency.R --self-test
      - name: Scan documentation for diagnostics-vocabulary drift
        run: Rscript tools/diagnostics-doc-consistency.R

  # G4 deferral gate. Verifies the owner disposition P0.5: G4 criterion 3 is
  # "verified where shipped", and a cell whose surface is specified but not
  # shipped must be explicitly deferred to a named carrier while remaining
  # UNSATISFIED. Fails when a deferral names no carrier, when a discharged
  # deferral is claimed by no REGISTERED claimant -- a verification slice or the
  # discharge record registered for that deferral in the traceability map's
  # `## Discharge records` table, which is the single definition both this gate
  # and `traceability-gate.R` now read (P0.7 D-E) -- or -- the load-bearing case --
  # when a deferred surface SHIPS while its cells are still deferred. That last
  # check is what stops "specified-but-unshipped" becoming a permanent parking
  # space the surface quietly escapes. Deterministic, network-free, base R.
  deferral-gate:
    needs: changes
    runs-on: ubuntu-latest
    name: G4 deferrals name carriers and no deferred surface has shipped
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.deferral_selftest == 'true'
        run: Rscript tools/deferral-gate.R --self-test
      - name: Verify the deferral register against the tree
        run: Rscript tools/deferral-gate.R

  # curl zero-reference gate (RURL-cunfohwy) -- the v3 line's CRAN release
  # criterion from P0.4 / RCON-09 section 4.
  #
  # THIS GATE IS RED TODAY, ON PURPOSE: curl::curl_parse_url() is still live at
  # the single remaining parse seam. Its self-test is BLOCKING (the gate itself
  # must be correct, and it passes), while the tree scan is deliberately
  # non-blocking -- wiring a known-red criterion as blocking would turn the
  # headline gate red for every unrelated change, which trains people to ignore
  # it. The scan's job right now is to publish the exact remaining worklist on
  # every run.
  #
  # WHEN THE REMOVAL LANDS: drop `continue-on-error`, and add the full run
  # (no --static-only) to the release act. --static-only never satisfies
  # RCON-09; only the full run's clean room does.
  curl-zero-gate:
    needs: changes
    runs-on: ubuntu-latest
    name: curl zero-reference (RCON-09)
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.curl_zero_selftest == 'true'
        run: Rscript tools/curl-zero-gate.R --self-test
      # Blocking as of RURL-robgajml: the removal has landed, so a new curl
      # reference is a regression, not a known-red backlog item. The static
      # scan runs here; the clean room (C7) needs a full R CMD check with the
      # package's dependencies installed, so it runs in the `check` matrix
      # rather than being duplicated on this bare runner.
      - name: Scan the tree for surviving curl references
        run: Rscript tools/curl-zero-gate.R --static-only

  coverage:
    needs: [check, changes]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    name: Test coverage
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage
      - name: Measure coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          covr::to_cobertura(cov)
        shell: Rscript {0}
      - uses: codecov/codecov-action@v7
        with:
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # Oracle-label gate (G4 criterion 2, P5.3 §2/§2.3). Criterion 2 reads
  # "Oracles are labeled by authority and claim boundary"; P5.3 §2 fixes a
  # CLOSED taxonomy of five authorities and registers/oracle-register.md binds
  # each shipped oracle instance to one. This gate makes that binding
  # executable: the taxonomy cannot gain a sixth label without a successor
  # record (O1), an oracle no authority admits must be OPEN and carried (O2),
  # and -- the rule that keeps the register alive -- a new fixture in the tree
  # fails the build until it is classified (O3). Deterministic and network-free:
  # it reads markdown and globs the tree, so it needs no package build.
  #
  # Appended at the end of this file deliberately: PR #246 inserts its own gate
  # job after `status-docs`, and keeping the two insertion points apart is what
  # stops these branches from conflicting on the same anchor a second time.
  oracle-labels:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    name: Oracles are labeled by authority and claim boundary (G4 criterion 2)
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.oracle_labels_selftest == 'true'
        run: Rscript design/work/url-v3/tools/oracle-label-gate.R --self-test
      - name: Every oracle instance is classified
        run: Rscript design/work/url-v3/tools/oracle-label-gate.R

  # G3.K citation resolution (RURL-ztakrggx). key-join-discharge.md claims its
  # 51-cell arithmetic is "derived and checkable" against the contract's own
  # tables; until this gate, nothing checked it, and every citation had gone
  # stale. Cheap: base R over markdown, no package build.
  #
  # Appended at the end for the same reason oracle-labels was -- separate
  # insertion points keep concurrent gate branches off one anchor.
  citations:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.citations == 'true'
    runs-on: ubuntu-latest
    name: G3.K citations resolve to the rows they name
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.citations_selftest == 'true'
        run: Rscript design/work/url-v3/tools/citation-gate.R --self-test
      - name: Every G3.K citation resolves
        run: Rscript design/work/url-v3/tools/citation-gate.R

  # pkgdown reference-index gate (RURL-mqexzpwt). `_pkgdown.yml`'s reference
  # index is hand-maintained, and nothing checked it covered the exports. It was
  # missing TEN of 40 -- serialize_url, get_url_key, url_key_policy, the six
  # joins, format_url -- each shipped by a slice that never opened the file. The
  # gap is silent until someone builds the site (RURL-vkltgopc), so the failure
  # arrives release-shaped rather than diff-shaped. Base R over three tracked
  # files; no package build, no yaml dependency.
  #
  # Appended at the end, like oracle-labels and citations: separate insertion
  # points keep concurrent gate branches off one anchor.
  pkgdown-index:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.pkgdown_index == 'true'
    runs-on: ubuntu-latest
    name: Every export reaches the pkgdown reference index
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Gate self-test (positive/negative coverage)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.pkgdown_index_selftest == 'true'
        run: Rscript tools/pkgdown-reference-gate.R --self-test
      - name: Reference index covers every export
        run: Rscript tools/pkgdown-reference-gate.R
