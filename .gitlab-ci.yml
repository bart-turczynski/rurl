# PROBE ONLY — not the proposed gate.
#
# This file exists to answer one empirical question before any design work is
# committed to: will a GitLab free-tier shared runner accept a job for this
# private project at all? Zero pipelines have ever run here, and free-tier
# shared runners are gated behind account identity verification, so
# `shared_runners_enabled: true` in the project settings is a setting, not a
# capability. It is cheaper to find out than to reason about.
#
# Two jobs, deliberately separated so a failure says which layer broke:
#   runner-probe  — can ANY job be scheduled (busybox, no toolchain)
#   gate-probe    — does the base-R, network-free gate family run in CI
#
# Delete this branch once the answer is recorded.

stages:
  - probe

runner-probe:
  stage: probe
  image: busybox:latest
  script:
    - echo "a shared runner picked up this job"
    - echo "runner=$CI_RUNNER_DESCRIPTION project=$CI_PROJECT_ID sha=$CI_COMMIT_SHA"

# The verify.yml gate family that needs NO package installation. Measured, not
# assumed: each of these reads tracked files or sources a single R/ file, and
# uses nothing outside base R (traceability-gate's stats/utils are base). This
# mirrors CI, where these same jobs run setup-r with no dependency step at all.
# It is the cheap high-value subset on a compute-minutes budget -- R CMD check,
# coverage and the cross-platform matrix are a separate, much costlier question.
gate-probe-base:
  stage: probe
  image: r-base:latest
  script:
    - Rscript tools/cache-doc-consistency.R
    - Rscript tools/status-doc-consistency.R
    - Rscript tools/diagnostics-doc-consistency.R
    - Rscript tools/release-rule-check.R
    - Rscript tools/deferral-gate.R
    - Rscript design/work/url-v3/tools/oracle-label-gate.R
    - Rscript design/work/url-v3/tools/traceability-gate.R

# The control-plane validators are a SEPARATE dependency class -- they need
# `yaml` and `digest`. The first probe run conflated the two and failed here,
# which is the measurement worth keeping: "the gates are base R" is true of
# verify.yml's family and false of the control plane. Installed from Debian
# packages rather than install.packages() so the job costs seconds, not minutes.
#
# validate-records.R is expected to report 2 pre-existing FAILURES on main (the
# G3-acceptance-2 input-hash drift -- the reopening rule working as designed,
# never to be swept), so it is reported and tolerated rather than blocking.
gate-probe-control-plane:
  stage: probe
  image: r-base:latest
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends r-cran-yaml r-cran-digest
    - Rscript design/work/url-v3/tools/validate-transitions.R
    - Rscript design/work/url-v3/tools/validate-records.R || echo "EXPECTED: G3-acceptance-2 hash drift"
    - Rscript design/work/url-v3/tools/validate-manifest.R design/work/url-v3/manifest.yaml || echo "EXPECTED: P0.6 awaiting its seal"
