# GitLab CI for rurl: fleet-ci's template, pinned by commit SHA (seor
# ADR 0012, fleet-ci README "The CI template"). The template owns the event
# table, the jobs and the images; this file sets only the package's switches
# and settings, and adds rurl's x-* jobs. A push to main or a branch, and a
# merge request, create no pipeline: the merge gate is the local one
# (.fleet-ci/gate, run by the .fleet-ci/pre-push hook; settings in
# .fleet-ci.yml). T2 runs on the deep-check schedule (SCHEDULE_KIND=deep-check,
# schedule 4472809), T3 on a RELEASE=1 web pipeline and a v* tag. The
# dependency-audit schedule (4467472) gets no pipeline: osv-audit and
# security-audit run in T2. design/ci.md says what moved where.
#
# Bump the pin by changing `ref:` and re-running fleet-ci's bin/vendor at the
# same SHA, in one merge request: .fleet-ci/VERSION must equal `ref:`.
include:
  - project: bart-turczynski/fleet-ci
    ref: 78cc09b730db1853f7501d2a3e8bb82475723a68
    file: templates/r-package.yml

variables:
  # punycoder's configure builds its libidn2 backend when pkg-config finds
  # libidn2, as on CRAN's Debian flavors, and rurl's tests can behave
  # differently there: rurl 3.1.0's first upload failed CRAN's Debian
  # pre-test on exactly that (RURL-woljcpfu). So the release legs
  # (t2-check-release, t2-ascran, coverage) and the local gate run on the
  # image with libidn2; .fleet-ci.yml's `variant` must name the same image.
  # The build without libidn2, as on CRAN's Windows flavors, is
  # x-check-no-idn2 below, plus the oldrel, devel, floor and locale legs,
  # which run on fleet-r (SEOR-hxxxkmws).
  FLEET_RELEASE_VARIANT: "fleet-r-idn2"
  # rurl has no compiled code of its own, and never had a sanitizer leg.
  FLEET_SANITIZERS: "false"
  # The declared floor, `Depends: R (>= 4.1.0)`: 4.1 is the oldest minor with
  # an arm64 rocker/r-ver image, which the runner needs. The snapshot must
  # serve the DESCRIPTION floors of punycoder (1.2.1), pslr (1.2.2, on CRAN
  # 2026-10-24) and raddr (0.1.2), so it is fleet-ci's own p3m date. Its
  # Ubuntu 20.04 binary path spares source builds on rocker/r-ver:4.1.3,
  # whose image has no libcurl headers. Unproven until the first T2 run:
  # design/ci.md, "Accepted gaps".
  FLEET_FLOOR_R: "4.1.3"
  FLEET_FLOOR_SNAPSHOT: "https://packagemanager.posit.co/cran/__linux__/focal/2026-10-28"

# punycoder built without libidn2, at the release R version: the cell CRAN's
# Windows flavors build (SEOR-hxxxkmws). The assertion fails the job when the
# library it checks against holds a punycoder with libidn2, so this job is
# never silently the libidn2 cell; the local gate asserts the opposite.
x-check-no-idn2:
  extends: .t2-job
  image: $FLEET_RELEASE_IMAGE
  variables:
    FLEET_RELEASE_VARIANT: "fleet-r"
    NOT_CRAN: "true"
    _R_CHECK_CRAN_INCOMING_: "false"
    _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
    FLEET_CHECK_ARGS: "--no-manual"
    FLEET_BUILD_ARGS: "--no-manual --compact-vignettes=gs+qpdf"
  before_script:
    - !reference [.fleet-r, before_script]
  script:
    - fleet-tools Rscript -e '.libPaths(c(Sys.getenv("FLEET_RUN_LIB"), .libPaths())); b <- punycoder:::.backend_info(); print(b); if (!identical(b$has_libidn2, FALSE)) stop("punycoder was built with libidn2, so this job is not the cell without it (SEOR-hxxxkmws)", call. = FALSE)'
    - !reference [.fleet-scripts, check]
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - check/

# The FOSSA license and security scan (fleet standard, "FOSSA": rurl holds
# one of the five free-plan slots). It ran on every push to main; it now runs
# in every T2 and T3 pipeline (seor ADR 0012, `x-fossa`), so the FOSSA
# project is refreshed weekly and at each release. `fossa analyze` uploads to
# the project `.fossa.yml` names and reads `FOSSA_API_KEY`, a masked CI/CD
# variable only the owner can set. The CLI comes from FOSSA's official
# install script, which picks the linux/arm64 build on this runner.
x-fossa:
  extends: .t2-job
  image: debian:stable-slim
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends curl ca-certificates git
    - 'curl -fsSL -H "Cache-Control: no-cache" https://raw.githubusercontent.com/fossas/fossa-cli/master/install-latest.sh | bash'
    - fossa analyze
