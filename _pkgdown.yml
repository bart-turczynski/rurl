# Published by the `pages` job in .gitlab-ci.yml (RURL-vkltgopc), which runs
# only on a tag or a hand-started pipeline, so the live site documents the
# last release. DESCRIPTION's URL: field names this same site, first. The
# previous host (bart-turczynski.github.io/rurl) was built by a GitHub Actions
# workflow whose account is suspended; that workflow is gone.
#
# No `destination:` on purpose: the site builds into docs/ (gitignored), and
# the `pages` job renames it to public/ for GitLab Pages.
url: https://bart-turczynski.gitlab.io/rurl/

template:
  bootstrap: 5

authors:
  "Bart Turczynski":
    href: https://turczynski.pl

home:
  title: "rurl — Parse, Clean, and Normalize URLs"
  description: >
    A lightweight toolkit for extracting structured information from URLs.
    Includes vectorized, pipe-friendly functions for parsing, normalizing protocols,
    extracting domains, and constructing clean URLs. Domain and public-suffix
    extraction is delegated to the pslr package.

navbar:
  structure:
    left: [intro, reference, articles, news, acknowledgments]
    right: [search, gitlab]
  components:
    acknowledgments:
      text: Acknowledgments
      href: https://gitlab.com/bart-turczynski/rurl/-/blob/main/ACKNOWLEDGMENTS.md
    gitlab:
      icon: fab fa-gitlab
      href: https://gitlab.com/bart-turczynski/rurl
      aria-label: GitLab

footer:
  structure:
    left: developed_by
    right: [built_with, related]
  components:
    related: >
      Related:
      <a href="https://CRAN.R-project.org/package=pslr">pslr</a> ·
      <a href="https://CRAN.R-project.org/package=punycoder">punycoder</a>

reference:
  - title: "Parsing"
    desc: "Parse one or many URLs into structured components."
    contents:
      - safe_parse_url
      - safe_parse_urls

  - title: "Profiles"
    desc: >
      Inspect the named profile bundles that preset the acceptance,
      interpretation, leniency, and canonicalization knobs.
    contents:
      - url_profile

  - title: "Accessors"
    desc: "Extract individual URL components from character vectors."
    contents:
      - get_clean_url
      - get_parse_status
      - get_scheme
      - get_host
      - get_domain
      - get_tld
      - get_subdomain
      - get_path
      - get_query
      - get_fragment
      - get_port
      - get_user
      - get_password
      - get_userinfo

  - title: "Standard diagnostics"
    desc: >
      Companion helpers for the url_standard selector: host classification,
      scheme classification, and non-fatal validation/safety facts.
    contents:
      - get_host_type
      - get_scheme_class
      - get_url_diagnostics
      - get_parse_verdicts
      - get_mailto_recipients

  - title: "Host validation policy"
    desc: >
      Policy layer on top of standards-correct parsing: is a parsed host a
      practical web hostname, DNS owner name, registrable site host, or
      SEO-safe host? Never changes how a URL parses.
    contents:
      - is_valid_host
      - check_hosts

  - title: "Query introspection"
    desc: "Audit query parameters across a set of URLs."
    contents:
      - query_param_summary

  - title: "Resolution"
    desc: "Resolve relative or absolute references against a base URL."
    contents:
      - resolve_url

  - title: "Full-string output surfaces"
    desc: >
      The whole URL as a string, on the surface you actually want: the
      standard's own serialization, or a rendering safe to show a person.
      Neither is get_clean_url(), which is a cleaning product.
    contents:
      - serialize_url
      - format_url

  - title: "Identity and joining"
    desc: >
      Compare and join URLs on identity rather than on a cleaned display
      string: a versioned comparison key, its policy object, and the six
      identity-keyed joins. canonical_join() is the legacy clean_url-keyed
      join, retained unchanged.
    contents:
      - get_url_key
      - url_key_policy
      - url_join
      - canonical_join

  - title: "Cache management"
    desc: "Inspect and control the memoization caches."
    contents:
      - rurl_cache_info
      - rurl_cache_config
      - rurl_clear_caches
