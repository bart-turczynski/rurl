# The fleet-ci local gate's settings: T0 (docs) and T1 (full) before every
# push, run by .fleet-ci/gate in the fleet image (fleet-ci README, "The
# .fleet-ci.yml file"; seor ADR 0012). Read from the pushed commit.
version: 1

# The image the gate runs in. fleet-r-idn2 carries libidn2, so punycoder can
# build its libidn2 backend, as on CRAN's Debian flavors, where rurl 3.1.0's
# first upload failed (RURL-woljcpfu). It must be .gitlab-ci.yml's
# FLEET_RELEASE_VARIANT. T2 runs the libidn2 cell again (x-check-idn2); the
# build without libidn2 is T2's release legs, which install Posit Package
# Manager's binary.
variant: fleet-r-idn2

# Paths on the classifier's docs allowlist that a full-tier cheap gate reads,
# so a change to them gets the full tier: T0 runs only spelling and
# check_pkgdown(), which would pass a change that breaks one of these gates.
# The manifest gates (tools/verify.R) validate the records under
# design/work/url-v3/ (validate-records, traceability, citation, deferral,
# release-rule, oracle-label, oracle-provenance), and validate-records
# resolves ADR numbers against design/adr/; the manifest's
# tools/pkgdown-reference-gate.R checks _pkgdown.yml's reference index
# against the exports. (scripts/check-bugreports.py also reads _pkgdown.yml,
# but it is a pre-commit pre-push hook and runs on every push, either tier.)
docs_exclude:
  - design/work/url-v3/**
  - design/adr/**
  - _pkgdown.yml

# T0, and the start of T1. Genuine terms go in inst/WORDLIST (SEOR-mtbzfroz).
docs_gates:
  - Rscript -e 'bad <- spelling::spell_check_package(); if (nrow(bad)) { print(bad); quit(status = 1) }'

# T1, in the container after the dependency install, each run whatever the
# others report:
# - the manifest gates and their self-tests (tools/verify.R reads the list
#   from tools/verify-manifest.yml; the export has no git history, so it runs
#   every self-test);
# - man/, NAMESPACE and DESCRIPTION against a fresh roxygen2 run
#   (SEOR-nwfmerhu); lintr; README.md against a fresh knit of README.Rmd
#   (SEOR-qaulrrja: the manifest's `readme` job is a record, not a gate);
#   the NEWS heading against the version;
# - every declared URL (the gate's R CMD check runs with remote incoming, and
#   so its URL check, off);
# - the whole suite (bar the two audits) under LC_ALL=C, through
#   test_local(), with the locale-relevant files asserted to have run
#   (RURL-izzuenjx). It is the only non-UTF-8 test run: t2-locale sets
#   LC_ALL=C, but R CMD check runs tests/testthat.R, which selects
#   en_US.UTF-8;
# - the tests that need the source tree, from it (their R CMD check skips
#   are allowed below).
# First, punycoder rebuilt from source in the run library and asserted to
# carry libidn2 (SEOR-hxxxkmws): the dependency install takes Posit Package
# Manager's binary, built without it, and R CMD check below runs against
# the rebuilt one.
cheap_gates:
  - Rscript scripts/punycoder-backend.R "$R_LIBS" libidn2
  - Rscript tools/verify.R --gates
  - Rscript scripts/check-docs-drift.R .
  - Rscript -e 'lints <- lintr::lint_package(); if (length(lints)) { print(lints); quit(status = 1) }'
  - sh scripts/check-readme-drift.sh
  - sh scripts/check-news-version.sh
  - Rscript scripts/check-urls.R
  - LC_ALL=C LANG=C Rscript tools/check-locale-tests.R
  - Rscript tools/check-source-tests.R

# test-strings-base.R and test-invalid-utf8-batch.R switch LC_CTYPE to
# en_US.UTF-8, and test-scheme-policy.R to tr_TR.UTF-8 and az_AZ.UTF-8 (the
# dotless-i case folds), and each skips when its locale is missing;
# tests/testthat.R selects en_US.UTF-8. The gate runs as the invoking user
# and reads compiled locales from its own LOCPATH only (fleet-ci README, "A
# known local/CI difference: locales").
locales:
  - en_US.UTF-8
  - tr_TR.UTF-8
  - az_AZ.UTF-8

# The gate runs R CMD check with NOT_CRAN=true, so skip_on_cran() no longer
# keeps these out of it. T2 runs both, as osv-audit and security-audit.
exclude_tests:
  - path: tests/testthat/test-osv.R
    why: queries osv.dev over the network; the osv-audit job runs it in T2
  - path: tests/testthat/test-security.R
    why: queries Sonatype OSS Index with credentials the gate does not have; the security-audit job runs it in T2

# Every skip R CMD check's test run may report; any other fails the gate.
# Each reads the source tree, which an installed-package check lacks; the
# cheap gate tools/check-source-tests.R runs them from the source tree.
allowed_skips:
  - reason: tools/oracle/derive-ip-obfuscation.R is not reachable from this run
    why: test-uts46-transcription-pin.R (two tests) reads tools/; tools/check-source-tests.R runs it
  - reason: register not present in an installed check
    why: test-url-join.R reads design/work/url-v3/registers/; tools/check-source-tests.R runs it
  - reason: package sources not available
    why: test-stringi-bool-key-query.R reads R/; tools/check-source-tests.R runs it

# The top-level .md files the pkgdown site publishes; every other one (the
# agent files among them) is moved out before build_site() (SEOR-wqxhftpv).
# ARCHITECTURE.md and RELEASE_NOTES_v1.md were already live when the
# keep-list landed and stay published. cran-comments.md is on pkgdown's own
# skip list.
pages_keep:
  - README.md
  - NEWS.md
  - LICENSE.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md
  - ACKNOWLEDGMENTS.md
  - cran-comments.md
  - ARCHITECTURE.md
  - RELEASE_NOTES_v1.md
