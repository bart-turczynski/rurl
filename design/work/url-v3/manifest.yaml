# --- Fresh-clone restore drill; exercised and asserted by G0.4 (RURL-zyksymya).
restore_instructions: |
  Reconstruct baseline authority from a fresh clone, without local memory.
  NOTE: registers/snapshots.log is written by each seal PR *after* its tag, so it
  lives on main (a descendant of every snapshot commit), not at a tag commit. Read
  the log from the default branch; do not check out a tag to read it.

    1. Clone the repository (default branch = main, which carries the sealed
       snapshots.log and this manifest):
         git clone <repo-url> rurl && cd rurl
    2. Read the LATEST snapshot binding (authority is the log line, not the
       movable ref) — the highest-n row, which matches control_plane_snapshot —
       and verify its tag resolves to that exact commit:
