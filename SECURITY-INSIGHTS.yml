header:
  schema-version: 2.2.0
  last-updated: '2026-08-08'
  last-reviewed: '2026-08-08'
  url: https://gitlab.com/bart-turczynski/rurl/-/raw/main/SECURITY-INSIGHTS.yml
  comment: |
    OpenSSF Security Insights self-report for rurl, a CRAN R package for
    parsing, normalizing, cleaning, and joining URLs. Maintained alongside
    SECURITY.md (human-readable policy) and .bestpractices.json (OpenSSF Best
    Practices badge self-assessment).

project:
  name: rurl
  homepage: https://gitlab.com/bart-turczynski/rurl
  administrators:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      social: https://orcid.org/0000-0002-8788-7980
      primary: true
  documentation:
    quickstart-guide: https://CRAN.R-project.org/web/packages/rurl/vignettes/getting-started.html
    detailed-guide: https://CRAN.R-project.org/web/packages/rurl/rurl.pdf
    release-process: https://gitlab.com/bart-turczynski/rurl/-/blob/main/CONTRIBUTING.md
  repositories:
    - name: rurl
      url: https://gitlab.com/bart-turczynski/rurl
      comment: |
        Sole repository for the rurl package. Domain/public-suffix extraction is
        delegated to the sibling pslr package and Punycode/IDNA to punycoder.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Bart Turczynski
      email: bartek@turczynski.pl
      primary: true
    policy: https://gitlab.com/bart-turczynski/rurl/-/blob/main/SECURITY.md
    in-scope:
      - Unsafe handling of untrusted URL input passed to the parsing and
        normalization functions.
    out-of-scope:
      - Vulnerabilities in dependencies (curl, stringi, punycoder, pslr); report
        those upstream.
    comment: |
      Please do not report vulnerabilities through public issues. Email the
      maintainer at bartek@turczynski.pl, or open a GitLab issue with the
      "This issue is confidential" box ticked. Acknowledgment is targeted
      within 7 days. rurl is a pure-R library that makes no network connections
      of its own and handles no credentials.

repository:
  url: https://gitlab.com/bart-turczynski/rurl
  status: active
  bug-fixes-only: false
  accepts-change-request: true
  accepts-automated-change-request: false
  no-third-party-packages: false
  core-team:
    - name: Bart Turczynski
      email: bartek@turczynski.pl
      social: https://orcid.org/0000-0002-8788-7980
      primary: true
  documentation:
    contributing-guide: https://gitlab.com/bart-turczynski/rurl/-/blob/main/CONTRIBUTING.md
    security-policy: https://gitlab.com/bart-turczynski/rurl/-/blob/main/SECURITY.md
  license:
    url: https://gitlab.com/bart-turczynski/rurl/-/blob/main/LICENSE
    expression: MIT
  release:
    changelog: https://gitlab.com/bart-turczynski/rurl/-/blob/main/NEWS.md
    automated-pipeline: false
    distribution-points:
      - uri: https://CRAN.R-project.org/package=rurl
        comment: Canonical release channel (CRAN).
      - uri: https://gitlab.com/bart-turczynski/rurl/-/releases
        comment: |
          Tagged GitLab releases. Tagging has historically been sparse — several
          CRAN versions were never tagged — so CRAN, not this page, is the
          authoritative record of what was released.
  security:
    assessments:
      self:
        evidence: https://www.bestpractices.dev/projects/13394
        date: '2026-08-08'
        comment: |
          Ongoing OpenSSF Best Practices badge self-assessment, tracked in
          .bestpractices.json at the repository root.
    champions:
      - name: Bart Turczynski
        email: bartek@turczynski.pl
        primary: true
    tools:
      - name: rosv (OSV)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: |
          Audit of the runtime dependency closure against the OSV database
          (osv.dev). No account or secrets required. This ran weekly and on
          push from .github/workflows/osv-audit.yml until the GitHub account
          was suspended; it is now run on demand by the maintainer, and `ci`
          is reported false rather than claim automation that cannot fire.
      - name: oysteR (Sonatype OSS Index)
        type: SCA
        rulesets:
          - default
        integration:
          adhoc: true
          ci: false
          release: false
        results: {}
        comment: |
          Audit of declared dependencies against the Sonatype OSS Index. This
          ran weekly and on push from .github/workflows/security-audit.yml
          until the GitHub account was suspended; it is now run on demand by
          the maintainer, and `ci` is reported false rather than claim
          automation that cannot fire.
