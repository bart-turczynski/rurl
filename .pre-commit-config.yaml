# Pre-commit gate, mirroring CI. Install with `pre-commit install` (pre-commit
# hooks) and `pre-commit install --hook-type pre-push` (the verify hook below).
#
# air (the R formatter) is intentionally NOT wired up here: this package has not
# adopted air (no air.toml), so enabling it would reformat the whole source tree
# in one churny pass. Adopting air is a separate, opt-in slice.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # These paths are byte-pinned: tools/oracle-provenance-gate.R PV3
      # recomputes each one's sha256 and compares it to the digest recorded in
      # tests/testthat/fixtures/oracle-provenance.json. A fixer that appends a
      # newline or strips a trailing space changes the bytes and turns PV3 red,
      # so they are off limits. inst/bench/wpt-url-cases.json in particular is
      # stored exactly as fetched upstream, which means NO final newline.
      #
      # Keep this list in sync with the in-repo fixtures PV3 hashes.
      - id: end-of-file-fixer
        exclude: &byte-pinned '^(tests/testthat/fixtures/|inst/bench/wpt-url-cases\.json$)'
      - id: trailing-whitespace
        exclude: *byte-pinned
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending
        exclude: *byte-pinned
      - id: check-case-conflict
  - repo: local
    hooks:
      # Mirrors the CI fast gate. Runs on push (not per commit) since a full
      # build + check is slow.
      #
      # The command used to be spelled inline here as lintr + rcmdcheck. It now
      # delegates to tools/verify.R, which additionally runs the ~20 gate steps
      # this hook never covered -- and those are the ones that actually rotted:
      # four gates were simultaneously red on an integration branch while lint
      # and the test suite stayed green (RURL-mvsxmyww). Keeping the definition
      # in a committed script rather than a YAML string also means it can be run
      # by hand, listed with --list, and reviewed as code.
      - id: verify
        name: verify (mirrors CI's fast gate)
        entry: Rscript tools/verify.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
        verbose: true
