# The hygiene hooks, at commit and at push, and the archival-mirror refresh
# after a merge. Install with `pre-commit install` (all three hook types, from
# default_install_hook_types below), then `.fleet-ci/pre-push --install`,
# which replaces pre-commit's pre-push hook with fleet-ci's: that hook runs
# the fleet-ci local gate (.fleet-ci/gate, settings in .fleet-ci.yml) on each
# pushed ref, then this file's pre-push stage. The gate itself (the manifest
# gates, docs drift, lintr, spelling, the URL check, R CMD check and the
# locale tests) is in .fleet-ci.yml, never here: this file must not run
# .fleet-ci/gate (fleet-ci README, "The local gate").
#
# Over fleet-ci's hook, `pre-commit install` and
# `pre-commit install --hook-type pre-push` without -f move it to
# hooks/pre-push.legacy (pre-commit's migration mode), which still runs the
# gate first. `pre-commit install -f` (every type, from
# default_install_hook_types) and `pre-commit install -f --hook-type pre-push`
# delete it and drop the gate; `-f --hook-type pre-commit` and
# `-f --hook-type post-merge` leave it alone. Re-run
# `.fleet-ci/pre-push --install` after either of the two.
default_install_hook_types: [pre-commit, pre-push, post-merge]
#
# air (the R formatter) is intentionally NOT wired up here: this package has not
# adopted air (no air.toml), so enabling it would reformat the whole source tree
# in one churny pass. Adopting air is a separate, opt-in slice.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=5120']
      # These paths are byte-pinned: tools/oracle-provenance-gate.R PV3
      # recomputes each one's sha256 and compares it to the digest recorded in
      # tests/testthat/fixtures/oracle-provenance.json. A fixer that appends a
      # newline or strips a trailing space changes the bytes and turns PV3 red,
      # so they are off limits. inst/bench/wpt-url-cases.json in particular is
      # stored exactly as fetched upstream, which means NO final newline.
      #
      # Keep this list in sync with the in-repo fixtures PV3 hashes.
      #
      # tests/testthat/_snaps/ is off limits for a different reason: testthat
      # OWNS those bytes and rewrites them on every run, passing runs included.
      # Its writer ends the file with a blank line, which end-of-file-fixer then
      # strips -- so the committed form was one the suite could never reproduce,
      # every local test run left the tree dirty, and the former pre-push
      # verify hook failed with "files were modified by this hook" even on a
      # green gate.
      #
      # inst/LICENSE.psl is UPSTREAM-OWNED text (RUL-008): the Mozilla Public
      # License 2.0 as the Public Suffix List ships it, carried verbatim under
      # LICENSE.note. Its trailing spaces and missing final newline are the
      # upstream bytes; a "fix" would make this copy differ from the text it
      # claims to reproduce.
      #
      # analysis/**/*.csv and analysis/**/run-console.txt are RECORDED
      # MEASUREMENT OUTPUT (RUL-008): what a scoring run printed and wrote,
      # committed as evidence of that run. The bytes the fixers object to ARE
      # the measurement: the bare CR that mixed-line-ending sees in the scored
      # CSVs sits inside a quoted URL-input field (it is the input under test,
      # not a line ending), and the console logs' trailing spaces are what the
      # run printed. Editing them after the fact makes the record disagree
      # with a re-run.
      #
      # design/win-builder-logs/ is the same kind of thing: 00check.log exactly
      # as win-builder served it, kept because those result URLs are deleted
      # after ~72 hours. testthat prints its diff lines with trailing spaces
      # ("`expected`: TRUE "), so a fixer pass silently edits the evidence and
      # the transcript stops matching the log it cites.
      #
      # .fleet-ci/ is fleet-ci's bin/vendor output, which seor's fleet checker
      # requires byte for byte; re-run bin/vendor rather than editing it.
      #
      # Design prose and registers are deliberately NOT here: they are authored,
      # so the fixers own their whitespace like any other source file. The
      # exception above is recorded output that happens to live under design/.
      - id: end-of-file-fixer
        exclude: &fixer-excludes '^(\.fleet-ci/|tests/testthat/fixtures/|tests/testthat/_snaps/|inst/bench/wpt-url-cases\.json$|inst/LICENSE\.psl$|analysis/.*\.csv$|analysis/.*/run-console\.txt$|design/win-builder-logs/)'
      - id: trailing-whitespace
        exclude: *fixer-excludes
      - id: check-merge-conflict
      # Every YAML file but .gitlab-ci.yml through PyYAML's safe loader.
      - id: check-yaml
        exclude: ^\.gitlab-ci\.yml$
      # .gitlab-ci.yml with --unsafe: syntax only. Its x-* jobs use GitLab's
      # `!reference` tag, which the safe loader cannot construct. GitLab's CI
      # lint API and fleet-ci's bin/rules-sim read that file in full.
      - id: check-yaml
        name: check yaml (.gitlab-ci.yml, syntax only)
        args: [--unsafe]
        files: ^\.gitlab-ci\.yml$
      - id: mixed-line-ending
        exclude: *fixer-excludes
      - id: check-case-conflict
  # British spellings in code, comments, string literals, tooling and design
  # prose, which spelling::spell_check_package() (the fleet-ci gate's docs
  # gate) never reads: it covers DESCRIPTION, roxygen, vignettes, README and
  # NEWS only (SEOR-xtmnpmae; seor design/fleet.md "Prose language"). Only the
  # en-GB_to_en-US dictionary is enabled, so this is not a general typo
  # checker. codespell skips dotfiles unless given --check-hidden, so
  # .bestpractices.json is skipped either way; it is listed so the intent
  # survives a flag change.
  #
  # Excluded, each because its bytes are not ours to respell:
  #   man/ -- roxygen output; fix the roxygen source in R/ and regenerate.
  #   tests/testthat/fixtures/ -- byte-pinned oracle fixtures (PV3 hashes
  #     them, the fixer excludes above) and oracle-provenance.json, the
  #     recorded provenance for those fixtures: its notes record what was
  #     verified at pin time, so they are evidence, not prose to modernize.
  #   tests/testthat/_snaps/ -- testthat owns and rewrites those bytes.
  #   inst/bench/wpt-url-cases.json, inst/LICENSE.psl -- upstream-owned text
  #     stored exactly as fetched (RUL-008), same as the fixer excludes above.
  #   analysis/**/*.csv, analysis/**/run-console.txt, design/win-builder-logs/
  #     -- recorded measurement output and check logs; editing them makes
  #     the record disagree with the run it cites.
  #   design/work/url-v3/{decisions,evidence,worklog}/ -- archival
  #     (design/AGENTS.md): never updated, not current authority. evidence/
  #     also holds the tracker snapshot, recorded text regenerated wholesale.
  #   .bestpractices.json -- mirrors the live bestpractices.dev entry.
  #   .fleet-ci/ -- fleet-ci's bin/vendor output.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: codespell (British spellings, en-GB_to_en-US; SEOR-xtmnpmae)
        args: [--builtin, en-GB_to_en-US]
        stages: [pre-commit, pre-push]
        exclude: '^(\.fleet-ci/|man/|tests/testthat/fixtures/|tests/testthat/_snaps/|inst/bench/wpt-url-cases\.json$|inst/LICENSE\.psl$|analysis/.*\.csv$|analysis/.*/run-console\.txt$|design/win-builder-logs/|design/work/url-v3/(decisions|evidence|worklog)/|\.bestpractices\.json$)'
  - repo: local
    hooks:
      # Refuses the push when this clone's pre-push hook is not fleet-ci's,
      # so the push would run without the gate (SEOR-gksaxuoz). It only
      # reads the hook file; it never runs .fleet-ci/gate.
      - id: fleet-ci-hook-installed
        name: fleet-ci pre-push hook is installed
        entry: sh scripts/check-fleet-hook.sh
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
      # This machine's R toolchain against what the package pins: roxygen2
      # against Config/roxygen2/version, installed packages built under a newer
      # R, and the local pandoc against the fleet image's (.fleet-ci/toolchain),
      # so a local devtools::document() or build_readme() writes what the gate
      # accepts. The gate itself runs in the fleet image and does not depend
      # on this machine's library. Quick: one request, for CRAN's package
      # index (SEOR-hxxxkmws, SEOR-tcytizic).
      - id: check-toolchain
        name: toolchain matches what this package pins
        entry: Rscript scripts/check-toolchain.R
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # CITATION.cff `version:` and .zenodo.json `"version"` must name the
      # release DESCRIPTION's Version names (X.Y.Z.9000 -> X.Y.Z), and every
      # URL they declare must also appear in DESCRIPTION's URL: field. Ported
      # from seor's scripts/check-citation.py (seor design/adr/0001), which is
      # stdlib-only and hardcodes nothing package-specific.
      - id: check-citation
        name: citation metadata vs DESCRIPTION
        entry: python3 scripts/check-citation.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # DESCRIPTION's BugReports: and every tracker link (codemeta.json,
      # .bestpractices.json, CONTRIBUTING.md, SECURITY.md) name /-/work_items,
      # and no human-facing file may carry a /-/issues link (seor ADR 0011,
      # https://gitlab.com/bart-turczynski/seor/-/blob/main/design/adr/0011-bugreports-names-work-items.md).
      # Ported from seor's scripts/check-bugreports.py (SEOR-sptibjph); the
      # reasoning is in its docstring. Offline, stdlib-only, wired exactly like
      # check-citation above.
      - id: check-bugreports
        name: BugReports and tracker links name /-/work_items
        entry: python3 scripts/check-bugreports.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # NEWS.md bullets are one terse line each (seor's fleet standard,
      # "NEWS.md bullets"). Ported verbatim from seor's scripts/check-news.py;
      # it takes milliseconds. Its self-test runs when the script changes.
      - id: news-terse
        name: NEWS.md bullets are one terse line
        entry: python3 scripts/check-news.py NEWS.md
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: news-terse-self-test
        name: check-news self-test
        entry: python3 scripts/check-news.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/check-news\.py$
        stages: [pre-push]

      # bestpractices-url.py is a maintainer tool that reads the network, so the
      # hook runs only its offline self-test, and only when the script changes.
      - id: bestpractices-url-self-test
        name: bestpractices-url self-test
        entry: python3 scripts/bestpractices-url.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/bestpractices-url\.py$
        stages: [pre-push]

      # Keeps the local archival mirror from going stale in silence
      # (RURL-eqgqbeti). The `backup` remote was wired once by RURL-ivsyshdj
      # and pushed once; six weeks later it was six commits behind and nothing
      # anywhere said so, on a repository whose only other gate is the hook
      # above (GitLab CI paused, GitHub account suspended).
      #
      # post-merge, because history arrives here exactly one way: merges happen
      # on the forge and reach this machine through `git pull`/`git merge`.
      # post-commit would fire on local commits that are not yet worth
      # archiving. Read tools/mirror-refresh.sh's header for the full rationale
      # and -- more importantly -- for what this does NOT guarantee: it is
      # installed per clone like every other hook here, it does not fire for
      # `git pull --rebase`, and git ignores a post-merge hook's exit status,
      # so a failure is loud but not blocking. The non-optional half is
      # tools/mirror-freshness.sh, which exits non-zero on drift.
      #
      # The script pushes with a plain `git push`: fleet-ci's gate skips a
      # push to a local mirror (a path URL, as backup's is), so it never sees
      # what an archival push carries (branches from before the fleet-ci
      # migration, a push to main adding more than one merge). Under
      # pre-commit's migration mode this file's pre-push stage still runs for
      # it. Nothing is ever force-pushed or pruned -- the mirror holds refs
      # found nowhere else (design/backup-mirror.md).
      - id: mirror-refresh
        name: refresh the local archival mirror
        entry: tools/mirror-refresh.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-merge]
        verbose: true
